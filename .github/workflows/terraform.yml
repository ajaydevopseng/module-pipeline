name: Terraform Infra Module
on:
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: read      
jobs:
  terraform:
    runs-on: [self-hosted, Windows, X64]
    
    steps:
     - name: Checkout
       uses: actions/checkout@v4
     - name: Azure Login
       uses: azure/login@v2
       with:
         client-id: "${{vars.AZURE_CLIENT_ID}}"
         tenant-id: "${{vars.AZURE_TENANT_ID}}"
         subscription-id: "${{vars.AZURE_SUBSCRIPTION_ID}}"
     - name: Setup
       uses: hashicorp/setup-terraform@v3
    
     - name: Terraform Init
       run: terraform init
       working-directory: ./env/prod
       
     - name: Terraform format
       run: terraform fmt 
       working-directory: ./env/prod
       
     - name: Terraform Plan
       run: terraform plan 
       working-directory: ./env/prod
         
        
    
      
